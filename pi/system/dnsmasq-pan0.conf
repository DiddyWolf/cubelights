# Serve DHCP strictly on the Bluetooth PAN bridge interface
interface=pan0
bind-dynamic
# Disable dnsmasq DNS server completely (port=0) so it never conflicts with NetworkManager/port 53
port=0
dhcp-range=10.55.0.10,10.55.0.50,255.255.255.0,12h
# Do not advertise a default gateway or DNS so Windows corporate VPN routing is untouched
dhcp-option=3
dhcp-option=6
